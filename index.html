  const arcanosMayoresDB = {

    "EL LOCO": { normal: "Locura, irreflexión, extravagancia, falta de disciplina, pasión e inicio de aventura.", invertida: "Descuido, ausencia, indecisión, apatía, mala elección." },
    "EL MAGO": { normal: "Habilidad, diplomacia, autoestima, flexibilidad, dominio de recursos.", invertida: "Falta de voluntad, torpeza, inseguridad, manipulación de intenciones." },
    "LA SUMA SACERDOTISA": { normal: "Sabiduría, sentido común, intuición, serenidad, verdades profundas.", invertida: "Ignorancia, incomprensión, egoísmo, juicios superficiales." },
    "LA EMPERATRIZ": { normal: "Éxito, fecundidad, abundancia material, creación, crecimiento.", invertida: "Inactividad, indecisión, derroche, infidelidad, bloqueo creativo." },
    "EL EMPERADOR": { normal: "Estabilidad, autoridad, poder mundano, estructura, convicción.", invertida: "Inmadurez, debilidad, tiranía, incapacidad de controlar emociones." },
    "EL SUMO SACERDOTE": { normal: "Inspiración, guía espiritual, costumbres, consejo, indulgencia.", invertida: "Servilismo, fragilidad, exceso de amabilidad, dogmatismo." },
    "LOS ENAMORADOS": { normal: "Amor, alianza, belleza, superar pruebas, elección consciente.", invertida: "Incapacidad de superar pruebas, infidelidad, frustración, separación." },
    "EL CARRO": { normal: "Éxito, superación de adversidades, determinación, avance decidido.", invertida: "Derrota, fracaso, pérdida de control, huida de la realidad." },
    "LA JUSTICIA": { normal: "Armonía, equidad, virtud, justa recompensa, resolución legal.", invertida: "Injusticia, acusaciones falsas, fanatismo, severidad." },
    "EL ERMITAÑO": { normal: "Consejo, prudencia, búsqueda interior, precaución.", invertida: "Imprudencia, aislamiento estéril, precipitación, inmadurez." },
    "LA RUEDA DE LA FORTUNA": { normal: "Destino, giros favorables, cambio inevitable, suerte.", invertida: "Fracaso, contratiempos inesperados, interrupciones." },
    "LA FUERZA": { normal: "Valor, fuerza interior, resolución, convicción, autodominio.", invertida: "Debilidad, tiranía, falta de confianza, enfermedad." },
    "EL COLGADO": { normal: "Nueva perspectiva, sacrificio consciente, pausa, regeneración.", invertida: "Apatía, sacrificio inútil, egoísmo, estancamiento." },
    "LA MUERTE": { normal: "Transformación, fin de un ciclo, cierre inevitable, renovación.", invertida: "Inercia, resistencia al cambio, estancamiento doloroso." },
    "TEMPLANZA": { normal: "Moderación, adaptación, armonía, equilibrio interior.", invertida: "Discordia, conflicto, impaciencia, falta de integración." },
    "EL DIABLO": { normal: "Ataduras, pasión ciega, materialismo, impulsos ocultos.", invertida: "Liberación de cadenas, despertar, tregua." },
    "LA TORRE": { normal: "Cambio abrupto, ruptura de falsas estructuras, liberación forzada.", invertida: "Atrapado en la rutina, opresión continua, retraso de la crisis." },
    "LA ESTRELLA": { normal: "Esperanza, inspiración, perspectivas brillantes, sanación.", invertida: "Esperanzas perdidas, decepción, pesimismo." },
    "LA LUNA": { normal: "Intuición, ilusiones, miedos subconscientes, confusión.", invertida: "Superación de engaños, claridad progresiva, desaciertos menores." },
    "EL SOL": { normal: "Éxito, claridad, alegría, energía vital, realización.", invertida: "Soledad, proyectos demorados, falta de claridad." },
    "EL JUICIO": { normal: "Renacimiento, llamada del destino, perdón, decisiones definitivas.", invertida: "Retraso, indecisión, incapacidad para comprender los hechos." },
    "EL MUNDO": { normal: "Cierre exitoso, plenitud, logro total, realización.", invertida: "Imperfección, proyectos incompletos, retraso del éxito." }
  };

  const arcanosMenoresDB = {
    "Ninguno": { normal: "", invertida: "" },
    "Rey de Bastos": { normal: "Liderazgo, lealtad, visión de negocios.", invertida: "Dogmatismo, severidad, autoridad destructiva." },
    "Reina de Bastos": { normal: "Energía, amabilidad, capacidad práctica.", invertida: "Inconstancia, celos, emociones volubles." },
    "Caballo de Bastos": { normal: "Viajes, acción rápida, dinamismo.", invertida: "Interrupciones, discusiones, desorganización." },
    "Sota de Bastos": { normal: "Buenas noticias, entusiasmo, lealtad.", invertida: "Inestabilidad, indecisión, chismes." },
    "As de Bastos": { normal: "Iniciativa, nuevo proyecto, pasión.", invertida: "Futuro sombrío, comienzos difíciles." },
    "Rey de Copas": { normal: "Madurez emocional, empatía, sabiduría.", invertida: "Engaño, manipulación emocional, vicios." },
    "Reina de Copas": { normal: "Intuición, amor devoto, contención.", invertida: "Inestabilidad emocional, falta de confianza." },
    "Caballo de Copas": { normal: "Oportunidad romántica, propuesta, arte.", invertida: "Falsedad, adulación, trampas." },
    "Sota de Copas": { normal: "Reflexión, mensaje afectivo, creatividad.", invertida: "Seducción engañosa, susceptibilidad." },
    "As de Copas": { normal: "Amor puro, plenitud emocional, fertilidad.", invertida: "Inestabilidad emocional, amor no correspondido." },
    "Rey de Espadas": { normal: "Intelecto, claridad mental, justicia firme.", invertida: "Crueldad, egoísmo, conflicto deliberado." },
    "Reina de Espadas": { normal: "Percepción aguda, independencia, perspicacia.", invertida: "Fanatismo, venganza, amargura." },
    "Caballo de Espadas": { normal: "Valentía, franqueza, determinación.", invertida: "Imprudencia, desacuerdos, caos." },
    "Sota de Espadas": { normal: "Vigilancia, agilidad mental, curiosidad.", invertida: "Impostura, noticias imprevistas." },
    "As de Espadas": { normal: "Triunfo de la verdad, gran determinación.", invertida: "Obstáculos, tiranía, confusión mental." },
    "Rey de Oros": { normal: "Éxito financiero, seguridad, abundancia.", invertida: "Avaricia, corrupción, materialismo rígido." },
    "Reina de Oros": { normal: "Generosidad, bienestar, prosperidad práctica.", invertida: "Incertidumbre, sospecha, negligencia." },
    "Caballo de Oros": { normal: "Perseverancia, responsabilidad, trabajo constante.", invertida: "Negligencia, estancamiento, pereza." },
    "Sota de Oros": { normal: "Estudio, nuevas oportunidades económicas.", invertida: "Malgasto, falta de lógica, pérdidas." },
    "As de Oros": { normal: "Prosperidad, regalo del destino, éxito material.", invertida: "Riqueza vacía, codicia, contratiempos financieros." }
  };

  const esquemasTiradas = {
    sino: ["Respuesta / Situación Actual"],
    tres: ["1. Pasado", "2. Presente", "3. Futuro"],
    cruz: [
      "1. Carta del Consultante",
      "2. Lo que le cubre (Ambiente e influencias)",
      "3. Lo que le cruza (Fuerzas opuestas)",
      "4. Lo que queda debajo (Base del asunto)",
      "5. Lo que queda detrás (Acontecimientos superados)",
      "6. Lo que corona (Futuro próximo)",
      "7. Lo que queda delante (Lo que sucederá en el futuro)",
      "8. Sus peores temores (Aspectos negativos)",
      "9. Ambiente familiar y social",
      "10. Sueños y esperanzas",
      "11. Resultado final"
    ]
  };

  function generarOpcionesSelect(baseDatos) {
    return Object.keys(baseDatos).map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function generarFormularioTirada() {
    const tipo = document.getElementById('tipoTirada').value;
    const contenedor = document.getElementById('contenedorPosiciones');
    contenedor.innerHTML = '';

    const posiciones = esquemasTiradas[tipo];
    const opcionesMayores = generarOpcionesSelect(arcanosMayoresDB);
    const opcionesMenores = generarOpcionesSelect(arcanosMenoresDB);

    posiciones.forEach((pos, index) => {
      contenedor.innerHTML += `
        <div class="posicion-box">
          <h4>✨ ${pos}</h4>
          <label for="mayor_${index}">Arcanos Mayores:</label>
          <select id="mayor_${index}" onchange="limpiarOtroSelect(${index}, 'mayor')">
            ${opcionesMayores}
          </select>
          <label class="checkbox-label">
            <input type="checkbox" id="inv_mayor_${index}"> 🔄 ¿Salió volteada / invertida?
          </label>
          <br>
          <label for="menor_${index}">Arcanos Menores:</label>
          <select id="menor_${index}" onchange="limpiarOtroSelect(${index}, 'menor')">
            ${opcionesMenores}
          </select>
          <label class="checkbox-label">
            <input type="checkbox" id="inv_menor_${index}"> 🔄 ¿Salió volteada / invertida?
          </label>
        </div>
      `;
    });
  }

  function limpiarOtroSelect(index, origen) {
    if (origen === 'mayor' && document.getElementById(`mayor_${index}`).value !== "Ninguno") {
      document.getElementById(`menor_${index}`).value = "Ninguno";
    } else if (origen === 'menor' && document.getElementById(`menor_${index}`).value !== "Ninguno") {
      document.getElementById(`mayor_${index}`).value = "Ninguno";
    }
  }

  function interpretarTirada() {
    const tipo = document.getElementById('tipoTirada').value;
    const posiciones = esquemasTiradas[tipo];
    
    let contadorMayores = 0;
    let contadorMenores = 0;
    let contadorInvertidas = 0;
    let desgloseDetallado = "";

    posiciones.forEach((pos, i) => {
      const valMayor = document.getElementById(`mayor_${i}`).value;
      const invMayor = document.getElementById(`inv_mayor_${i}`).checked;
      const valMenor = document.getElementById(`menor_${i}`).value;
      const invMenor = document.getElementById(`inv_menor_${i}`).checked;

      let cartaNombre = "Ninguna";
      let esInvertida = false;
      let significado = "";
      let esMayor = false;

      // Evaluación corregida: detecta adecuadamente el Arcano Mayor seleccionado
      if (valMayor !== "Ninguno") {
        cartaNombre = valMayor;
        esInvertida = invMayor;
        esMayor = true;
        contadorMayores++;
        if (tipo === 'cruz' && i === 2) esInvertida = false;
        significado = esInvertida ? arcanosMayoresDB[valMayor].invertida : arcanosMayoresDB[valMayor].normal;
      } else if (valMenor !== "Ninguno") {
        cartaNombre = valMenor;
        esInvertida = invMenor;
        contadorMenores++;
        if (tipo === 'cruz' && i === 2) esInvertida = false;
        significado = esInvertida ? (arcanosMenoresDB[valMenor]?.invertida || "Sin datos") : (arcanosMenoresDB[valMenor]?.normal || "Sin datos");
      }

      if (cartaNombre !== "Ninguna" && esInvertida) contadorInvertidas++;

      const estado = esInvertida ? "VOLTEADA (Invertida)" : "DERECHA";
      const tipoArcano = esMayor ? "[Arcano Mayor]" : (cartaNombre !== "Ninguna" ? "[Arcano Menor]" : "");

      desgloseDetallado += `📌 POSICIÓN: ${pos.toUpperCase()}\n`;
      desgloseDetallado += `   Carta: ${cartaNombre} ${tipoArcano} - ${estado}\n`;
      desgloseDetallado += `   Impacto: ${significado || "Sin carta seleccionada"}\n\n`;
    });

    let balanceArcanos = "";
    if (contadorMayores > contadorMenores) {
      balanceArcanos = "Predominan los ARCANOS MAYORES: Fuerzas del destino y transformaciones profundas en camino.";
    } else if (contadorMenores > contadorMayores) {
      balanceArcanos = "Predominan los ARCANOS MENORES: Asuntos cotidianos, decisiones del día a día y acciones directas.";
    } else if (contadorMayores > 0) {
      balanceArcanos = "EQUILIBRIO: Las acciones cotidianas están alineadas con lecciones del destino.";
    } else {
      balanceArcanos = "Sin selección de cartas suficiente.";
    }

    let balanceOrientacion = "";
    if (contadorInvertidas > (posiciones.length / 2)) {
      balanceOrientacion = "Presencia alta de cartas VOLTEADAS: Señala bloqueos, retrasos o introspección necesaria.";
    } else {
      balanceOrientacion = "Mayoría de cartas DERECHAS: La energía fluye directamente hacia la manifestación.";
    }

    let resultadoFinal = "==================================================\n";
    resultadoFinal += "🔮 SÍNTESIS ASTRAL Y BALANCE DE LA TIRADA\n";
    resultadoFinal += "==================================================\n";
    resultadoFinal += `• Balance energético: ${balanceArcanos}\n`;
    resultadoFinal += `• Flujo de energía: ${balanceOrientacion}\n\n`;
    resultadoFinal += "==================================================\n";
    resultadoFinal += "📋 REVELACIÓN DE CADA CARTA\n";
    resultadoFinal += "==================================================\n\n";
    resultadoFinal += desgloseDetallado;

    document.getElementById('cuadroInterpretacion').value = resultadoFinal;
  }

  generarFormularioTirada();
</script>
